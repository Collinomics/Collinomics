<svg xmlns="http://www.w3.org/2000/svg" width="720" height="58" viewBox="0 0 720 58" role="img" aria-label="Animated text: build, learn, improve, repeat">
<defs><linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00dfff"/><stop offset="1" stop-color="#ad62fa"/></linearGradient><clipPath id="typing"><rect x="45" y="12" width="0" height="36"><animate attributeName="width" values="0;490;490;0" keyTimes="0;.45;.85;1" dur="8s" repeatCount="indefinite"/></rect></clipPath></defs>
<rect x="2" y="2" width="716" height="54" rx="9" fill="#0A132A" stroke="url(#border)" stroke-width="1.5"/>
<circle cx="20" cy="29" r="5" fill="#04E7DF"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<g clip-path="url(#typing)"><text x="45" y="37" fill="#8AE9FF" font-family="monospace" font-size="20">&gt; BUILD  →  LEARN  →  IMPROVE  →  REPEAT</text></g>
</svg>