name: Daily Portfolio Maintenance

on:
  schedule:
    # 06:37 Kampala time (UTC+3)
    - cron: "37 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-portfolio-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Profile repository maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run maintenance checks
        id: health
        run: python scripts/daily_maintenance.py

      - name: Open alert issue if maintenance fails
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automated maintenance alert"
          existing=$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "Daily portfolio maintenance reported a failure. Review the Actions run and attached report: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue will be closed after a successful check."
          fi

      - name: Publish daily report commit
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ ! -d maintenance/reports ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: publish daily maintenance report [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-maintenance-report-${{ github.run_number }}
          path: maintenance/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Close alert after successful checks
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "in:title Automated maintenance alert" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Daily maintenance is healthy again. Closing this automated alert."
          fi
